name: Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./build.ps1
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/GlowLetters-*-Windows-x64-Setup.exe
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: GlowLetters-Windows-installer
          path: release/GlowLetters-*-Windows-x64-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/GlowLetters-*-Windows-x64-Setup.exe
          generate_release_notes: true
